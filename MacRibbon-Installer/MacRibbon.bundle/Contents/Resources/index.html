<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCAD Windows Ribbon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ribbon-container" id="ribbon" aria-label="AutoCAD Ribbon">
    <nav class="ribbon-tabs-bar" aria-label="Quick Access and Ribbon Tabs">
      <div class="qat-bar">
        <button type="button" class="cad-app-logo" data-dropdown="menu-app" aria-haspopup="menu" aria-expanded="false" aria-label="Application Menu" data-tip-title="Application Menu" data-tip-desc="File, export, print, and drawing utility commands">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 30 30" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24 L13 6 H17 L25 24 H20.5 L18.7 19.5 H11.3 L9.5 24 Z M12.8 15.8 H17.2 L15 10.2 Z" fill="#ffffff"/></svg><span class="app-arrow" aria-hidden="true">▾</span>
        </button>
        <button type="button" class="qat-btn" data-cmd="^C^C_QNEW" aria-label="New Drawing" data-tip-title="New" data-tip-desc="Creates a new drawing"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 H13 L17 7 V17 H6 Z" stroke="var(--icon-ink)" stroke-width="1.4"/><polyline points="13,3 13,7 17,7" stroke="var(--icon-ink)" stroke-width="1.3"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_OPEN" aria-label="Open Drawing" data-tip-title="Open" data-tip-desc="Opens an existing drawing file"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6 H8 L10 8 H17 V16 H3 Z" stroke="var(--icon-ink)" stroke-width="1.4"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_QSAVE" aria-label="Save Drawing" data-tip-title="Save" data-tip-desc="Saves the current drawing"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 H14 L17 6 V17 H4 Z" stroke="var(--icon-ink)" stroke-width="1.4"/><rect x="7" y="3" width="6" height="4.5" stroke="var(--icon-accent)" stroke-width="1.2"/><rect x="7" y="11" width="7" height="6" stroke="var(--icon-muted)" stroke-width="1.2"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_SAVEAS" aria-label="Save Drawing As" data-tip-title="Save As" data-tip-desc="Saves a copy of the current drawing under a new name"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 H13 L16 6 V17 H4 Z" stroke="var(--icon-ink)" stroke-width="1.4"/><path d="M11 12 L16 7 L18 9 L13 14 Z" stroke="var(--icon-accent)" stroke-width="1.3"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_PLOT" aria-label="Plot Drawing" data-tip-title="Plot" data-tip-desc="Plots the current drawing to a printer or PDF"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7 V3 H14 V7" stroke="var(--icon-ink)" stroke-width="1.3"/><rect x="3" y="7" width="14" height="7" rx="1" stroke="var(--icon-ink)" stroke-width="1.3"/><rect x="6" y="12" width="8" height="5" stroke="var(--icon-accent)" stroke-width="1.2"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_U" aria-label="Undo" data-tip-title="Undo" data-tip-desc="Reverses the most recent operation"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 H13 A4 4 0 0 1 13 15 H9" stroke="var(--icon-ink)" stroke-width="1.5"/><polyline points="9.5,4.5 6.5,7 9.5,9.5" stroke="var(--icon-ink)" stroke-width="1.5"/></svg></button>
        <button type="button" class="qat-btn" data-cmd="^C^C_REDO" aria-label="Redo" data-tip-title="Redo" data-tip-desc="Reverses the effects of the previous Undo"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7 H7 A4 4 0 0 0 7 15 H11" stroke="var(--icon-ink)" stroke-width="1.5"/><polyline points="10.5,4.5 13.5,7 10.5,9.5" stroke="var(--icon-ink)" stroke-width="1.5"/></svg></button>
        <button type="button" class="workspace-selector" data-dropdown="menu-workspace" aria-haspopup="menu" aria-expanded="false" data-tip-title="Workspace Switching" data-tip-desc="Switches between 2D Drafting and 3D Modeling tabs">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.8" stroke="var(--icon-ink)" stroke-width="1.4"/><circle cx="10" cy="10" r="6" stroke="var(--icon-muted)" stroke-width="1.3" stroke-dasharray="2.2 1.8"/></svg><span class="ws-label">Drafting &amp; Annotation</span><span class="arrow" aria-hidden="true">▾</span>
        </button>
      </div>

      <div class="ribbon-tabs" role="tablist" aria-label="Ribbon Tabs">
        <button type="button" class="tab-button active" role="tab" id="btn-tab-home" data-tab="tab-home" aria-controls="tab-home" aria-selected="true" tabindex="0">Home</button><button type="button" class="tab-button" role="tab" id="btn-tab-insert" data-tab="tab-insert" aria-controls="tab-insert" aria-selected="false" tabindex="-1">Insert</button><button type="button" class="tab-button" role="tab" id="btn-tab-annotate" data-tab="tab-annotate" aria-controls="tab-annotate" aria-selected="false" tabindex="-1">Annotate</button><button type="button" class="tab-button" role="tab" id="btn-tab-parametric" data-tab="tab-parametric" aria-controls="tab-parametric" aria-selected="false" tabindex="-1">Parametric</button><button type="button" class="tab-button" role="tab" id="btn-tab-3d" data-tab="tab-3d" aria-controls="tab-3d" aria-selected="false" tabindex="-1">3D Tools</button><button type="button" class="tab-button" role="tab" id="btn-tab-view" data-tab="tab-view" aria-controls="tab-view" aria-selected="false" tabindex="-1">View</button><button type="button" class="tab-button" role="tab" id="btn-tab-manage" data-tab="tab-manage" aria-controls="tab-manage" aria-selected="false" tabindex="-1">Manage</button><button type="button" class="tab-button" role="tab" id="btn-tab-output" data-tab="tab-output" aria-controls="tab-output" aria-selected="false" tabindex="-1">Output</button><button type="button" class="tab-button" role="tab" id="btn-tab-collaborate" data-tab="tab-collaborate" aria-controls="tab-collaborate" aria-selected="false" tabindex="-1">Collaborate</button><button type="button" class="tab-button" role="tab" id="btn-tab-express" data-tab="tab-express" aria-controls="tab-express" aria-selected="false" tabindex="-1">Express Tools</button>
      </div>

      <div class="ribbon-controls">
        <button type="button" class="ctrl-btn-toolbar" data-action="toggleHidePalettes" data-tip-title="Toggle Right Inspector" data-tip-desc="Shows or hides the Layers and Properties Inspector">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="1" stroke="var(--icon-ink)" stroke-width="1.4"/><line x1="12" y1="4" x2="12" y2="16" stroke="var(--icon-accent)" stroke-width="1.5"/></svg><span>Palettes</span>
        </button>
        <button type="button" class="ctrl-btn-toolbar" id="btn-switch-toolbar" data-tip-title="Switch to Mac Toolbar" data-tip-desc="Hides the Windows Ribbon and restores the native macOS Tool Sets palette">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="1" stroke="var(--icon-ink)" stroke-width="1.4"/><line x1="7.5" y1="4" x2="7.5" y2="16" stroke="var(--icon-accent)" stroke-width="1.5"/></svg><span>Mac Toolbar</span>
        </button>
        <button type="button" class="ctrl-btn" id="btn-minimize" aria-label="Minimize or Expand Ribbon" aria-expanded="true" data-tip-title="Minimize Ribbon" data-tip-desc="Collapses or expands the ribbon panels">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,8 10,13 15,8" stroke="var(--icon-ink)" stroke-width="1.6"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="btn-close" aria-label="Close Ribbon" data-tip-title="Close Ribbon" data-tip-desc="Closes the ribbon and restores Mac Tool Sets">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="15" y2="15" stroke="var(--icon-ink)" stroke-width="1.6"/><line x1="15" y1="5" x2="5" y2="15" stroke="var(--icon-ink)" stroke-width="1.6"/></svg>
        </button>
      </div>
    </nav>

    <main class="ribbon-body-wrap" aria-label="Active Ribbon Panels">
      <button type="button" class="ribbon-scroll-btn left" id="btn-scroll-left" aria-label="Scroll panels left">‹</button>
      <div class="ribbon-body" id="ribbon-body">
        <div class="tab-content active" id="tab-home" role="tabpanel" aria-labelledby="btn-tab-home"><section class="panel" id="panel-draw" aria-label="Draw"><div class="panel-content"><button type="button" class="btn-big" data-cmd="^C^C_LINE" data-tip-title="Line" data-tip-desc="Creates straight line segments"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="26" x2="26" y2="6" stroke="var(--icon-ink)" stroke-width="2"/><circle cx="6" cy="26" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="26" cy="6" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/></svg><span>Line</span></button><button type="button" class="btn-big" data-cmd="^C^C_PLINE" data-tip-title="Polyline" data-tip-desc="Creates a 2D polyline"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,25 11,9 21,19 27,7" stroke="var(--icon-ink)" stroke-width="2"/><circle cx="5" cy="25" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="11" cy="9" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="21" cy="19" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="27" cy="7" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/></svg><span>Polyline</span></button><div class="split-btn"><button type="button" class="split-main" data-cmd="^C^C_CIRCLE" data-tip-title="Circle" data-tip-desc="Creates a circle"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="10.5" stroke="var(--icon-ink)" stroke-width="1.9"/><line x1="16" y1="16" x2="26.2" y2="16" stroke="var(--icon-accent)" stroke-width="1.4" stroke-dasharray="2.5 1.8"/><circle cx="16" cy="16" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="26.2" cy="16" r="1.8" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/></svg><span>Circle</span></button><button type="button" class="split-arrow" data-dropdown="menu-circle" aria-haspopup="menu" aria-expanded="false" aria-label="Circle options">▾</button></div><div class="split-btn"><button type="button" class="split-main" data-cmd="^C^C_ARC" data-tip-title="Arc" data-tip-desc="Creates an arc"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24 A16 16 0 0 1 26 9" stroke="var(--icon-ink)" stroke-width="2"/><circle cx="6" cy="24" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="14.5" cy="11.5" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/><circle cx="26" cy="9" r="2.1" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/></svg><span>Arc</span></button><button type="button" class="split-arrow" data-dropdown="menu-arc" aria-haspopup="menu" aria-expanded="false" aria-label="Arc options">▾</button></div><div class="btn-cluster-3"><div class="split-sm-container"><button type="button" class="split-main-sm" data-cmd="^C^C_RECTANG" data-tip-title="Rectangle" data-tip-desc="Creates a rectangular polyline or polygon"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="11" stroke="var(--icon-ink)" stroke-width="1.6"/><circle cx="3" cy="4.5" r="1.5" fill="var(--icon-node)"/><circle cx="17" cy="15.5" r="1.5" fill="var(--icon-node)"/></svg><span>Rectangle</span></button><button type="button" class="split-arrow-sm" data-dropdown="menu-rect" aria-haspopup="menu" aria-expanded="false" aria-label="Rectangle options">▾</button></div><div class="split-sm-container"><button type="button" class="split-main-sm" data-cmd="^C^C_ELLIPSE" data-tip-title="Ellipse" data-tip-desc="Creates an ellipse or elliptical arc"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="10" rx="7.5" ry="4.8" stroke="var(--icon-ink)" stroke-width="1.6"/><circle cx="10" cy="10" r="1.5" fill="var(--icon-node)"/></svg><span>Ellipse</span></button><button type="button" class="split-arrow-sm" data-dropdown="menu-ellipse" aria-haspopup="menu" aria-expanded="false" aria-label="Ellipse options">▾</button></div><div class="split-sm-container"><button type="button" class="split-main-sm" data-cmd="^C^C_BHATCH" data-tip-title="Hatch" data-tip-desc="Fills an enclosed area with a hatch pattern"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" stroke="var(--icon-ink)" stroke-width="1.5"/><line x1="3" y1="10" x2="10" y2="3.5" stroke="var(--icon-accent)" stroke-width="1.3"/><line x1="3" y1="16.5" x2="16.5" y2="3.5" stroke="var(--icon-accent)" stroke-width="1.3"/><line x1="10" y1="16.5" x2="17" y2="9.5" stroke="var(--icon-accent)" stroke-width="1.3"/></svg><span>Hatch</span></button><button type="button" class="split-arrow-sm" data-dropdown="menu-hatch" aria-haspopup="menu" aria-expanded="false" aria-label="Hatch options">▾</button></div></div></div><button type="button" class="panel-footer" data-has-tray="true" aria-haspopup="true" aria-expanded="false"><span>Draw</span><span class="arrow" aria-hidden="true">▾</span></button></section><section class="panel" id="panel-modify" aria-label="Modify"><div class="panel-content"><button type="button" class="btn-big" data-cmd="^C^C_MOVE" data-tip-title="Move" data-tip-desc="Moves objects a specified distance"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="13" width="9" height="9" stroke="var(--icon-muted)" stroke-width="1.4" stroke-dasharray="2 1.5"/><rect x="17" y="6" width="9" height="9" stroke="var(--icon-ink)" stroke-width="1.8" fill="var(--icon-fill-soft)"/><line x1="10" y1="17" x2="21" y2="11" stroke="var(--icon-accent)" stroke-width="1.6"/><polyline points="17.5,10 21.5,10.8 19.5,14.5" stroke="var(--icon-accent)" stroke-width="1.6"/></svg><span>Move</span></button><button type="button" class="btn-big" data-cmd="^C^C_ROTATE" data-tip-title="Rotate" data-tip-desc="Rotates objects around a base point"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="15" width="9" height="9" stroke="var(--icon-muted)" stroke-width="1.4" stroke-dasharray="2 1.5"/><rect x="13" y="8" width="9" height="9" transform="rotate(-24 17 12)" stroke="var(--icon-ink)" stroke-width="1.8" fill="var(--icon-fill-soft)"/><path d="M25 22 A11 11 0 0 0 18 5.5" stroke="var(--icon-accent)" stroke-width="1.6"/><polyline points="20.5,3.5 17.5,5.5 20,8" stroke="var(--icon-accent)" stroke-width="1.5"/><circle cx="11.5" cy="22" r="1.8" fill="var(--icon-node)" stroke="var(--icon-surface)" stroke-width="0.9"/></svg><span>Rotate</span></button><div class="split-btn"><button type="button" class="split-main" data-cmd="^C^C_TRIM" data-tip-title="Trim" data-tip-desc="Trims objects to meet the edges of other objects"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="16" x2="17" y2="16" stroke="var(--icon-ink)" stroke-width="2"/><line x1="17" y1="16" x2="28" y2="16" stroke="var(--icon-muted)" stroke-width="1.5" stroke-dasharray="2.5 2"/><line x1="17" y1="5" x2="17" y2="27" stroke="var(--icon-accent)" stroke-width="1.5"/><line x1="20" y1="13" x2="27" y2="6" stroke="var(--icon-ink)" stroke-width="1.7"/><line x1="20" y1="13" x2="27" y2="20"
